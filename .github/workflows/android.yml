name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decrypt keystore if all 4 signing secrets are present.
      - name: Decode signing keystore
        if: ${{ env.SIGNING_KEY != '' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/keys/signing.keystore"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/keys/signing.keystore"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
          } >> "$GITHUB_ENV"

      - name: Run unit tests (DSP validation)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release signing
        if: ${{ env.KEYSTORE_PATH != '' }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/"*/apksigner | head -1)
          "$APKSIGNER" verify --print-certs "$APK" 2>&1 | tee /tmp/sig.txt
          grep -qi "9e6e8c535dd621852a5e8254ebedc8d1" /tmp/sig.txt && \
            echo "OK: expected SHA-256 prefix matches" || \
            (echo "FAIL: signature mismatch"; exit 1)

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pipa-trainer-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pipa-trainer-release
          path: app/build/outputs/apk/release/*.apk